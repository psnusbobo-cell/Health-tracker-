<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>مرشدي الصحي | الرادار الذكي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f8fafc; }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .active-nav { color: #0d9488; font-weight: bold; border-top: 2px solid #0d9488; }
        .scanning { animation: scan 2s infinite linear; }
        @keyframes scan { 0% { top: 0; } 50% { top: 100%; } 100% { top: 0; } }
    </style>
</head>
<body class="flex flex-col min-h-screen max-w-xl mx-auto bg-white shadow-2xl relative">

    <header class="bg-teal-900 text-white p-4 shadow-lg sticky top-0 z-50 flex justify-between items-center">
        <div class="flex items-center gap-2"><i data-lucide="scan-eye"></i><h1 class="text-lg font-bold">الرادار الصحي</h1></div>
        <button onclick="showTab('settings')" class="text-teal-300"><i data-lucide="settings" size="20"></i></button>
    </header>

    <main class="flex-1 p-4 pb-28 overflow-y-auto w-full space-y-6">
        
        <div id="scan" class="tab-content active space-y-6">
            <div class="bg-teal-50 border border-teal-100 p-4 rounded-2xl">
                <h2 class="text-sm font-bold text-teal-800 mb-2">تحليل التقارير والأشعة</h2>
                <p class="text-[10px] text-teal-700">ارفع الملف هنا، وسيقوم "الرادار" بقراءته وتلخيصه لك فوراً.</p>
            </div>

            <div id="drop-zone" class="relative border-2 border-dashed border-slate-300 rounded-3xl p-8 text-center bg-slate-50 transition-all">
                <input type="file" id="file-input" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" accept="image/*,.pdf">
                <div id="upload-ui">
                    <div class="bg-teal-100 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4">
                        <i data-lucide="upload-cloud" class="text-teal-700"></i>
                    </div>
                    <p class="text-xs font-bold text-slate-600">اضغط لرفع الأشعة أو التقرير (PDF/Image)</p>
                </div>
                <div id="preview-ui" class="hidden">
                    <p id="file-name" class="text-xs font-bold text-teal-700 mb-2"></p>
                    <button onclick="processFile()" id="process-btn" class="bg-teal-700 text-white px-6 py-2 rounded-xl text-xs font-bold">بدء التحليل الذكي ✨</button>
                </div>
                <div id="scan-line" class="hidden absolute left-0 right-0 h-1 bg-teal-400/50 blur-sm scanning"></div>
            </div>

            <div id="analysis-result" class="hidden bg-white p-4 rounded-2xl border border-slate-200 shadow-sm space-y-2">
                <h3 class="text-[10px] font-bold text-teal-600 uppercase">خلاصة التحليل الطبية:</h3>
                <p id="result-text" class="text-xs leading-relaxed text-slate-700"></p>
                <button onclick="confirmAndSave()" class="w-full bg-slate-800 text-white py-2 rounded-lg text-[10px]">تثبيت في السجل التاريخي ✅</button>
            </div>
        </div>

        <div id="settings" class="tab-content space-y-4">
            <h2 class="font-bold text-slate-800">إعدادات النظام</h2>
            <div class="bg-amber-50 p-4 rounded-2xl border border-amber-100 space-y-3">
                <label class="block text-[10px] font-bold text-amber-800">مفتاح API الخاص بك (Gemini Key):</label>
                <input id="api-key" type="password" class="w-full p-3 text-xs rounded-xl border border-amber-200" placeholder="ضع مفتاحك هنا ليعمل الرادار..">
                <button onclick="saveKey()" class="w-full bg-amber-600 text-white py-2 rounded-xl text-xs">حفظ المفتاح</button>
            </div>
        </div>

        <div id="history" class="tab-content space-y-4">
            <h2 class="font-bold text-slate-800">أرشيف التقارير</h2>
            <div id="reports-list" class="space-y-2"></div>
        </div>
    </main>

    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 flex justify-around py-2 z-50">
        <button onclick="showTab('scan')" class="nav-item flex flex-col items-center gap-1 active-nav"><i data-lucide="scan"></i><span class="text-[8px]">الرادار</span></button>
        <button onclick="showTab('history')" class="nav-item flex flex-col items-center gap-1 text-slate-400"><i data-lucide="archive"></i><span class="text-[8px]">الأرشيف</span></button>
    </nav>

    <script>
        let db = JSON.parse(localStorage.getItem('health_radar_v10')) || { reports: [] };
        let apiKey = localStorage.getItem('gemini_api_key') || "";
        let currentAnalysis = "";

        // التعامل مع الملفات
        const fileInput = document.getElementById('file-input');
        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                document.getElementById('upload-ui').classList.add('hidden');
                document.getElementById('preview-ui').classList.remove('hidden');
                document.getElementById('file-name').innerText = file.name;
            }
        });

        async function processFile() {
            if(!apiKey) return alert("يرجى وضع مفتاح API في الإعدادات أولاً");
            
            document.getElementById('scan-line').classList.remove('hidden');
            document.getElementById('process-btn').innerText = "جاري القراءة...";
            
            const file = fileInput.files[0];
            const base64 = await toBase64(file);
            const pureBase64 = base64.split(',')[1];
            const mimeType = file.type;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { text: "أنت خبير طبي تقني. حلل هذا الملف (صورة أو PDF) وأعطني خلاصة مركزة جداً باللغة العربية تشمل: التشخيص الأساسي، أي قيم غير طبيعية، والتوصية الفنية." },
                                { inline_data: { mime_type: mimeType, data: pureBase64 } }
                            ]
                        }]
                    })
                });

                const data = await response.json();
                currentAnalysis = data.candidates[0].content.parts[0].text;
                
                document.getElementById('analysis-result').classList.remove('hidden');
                document.getElementById('result-text').innerText = currentAnalysis;
            } catch (error) {
                alert("خطأ في الاتصال. تأكد من صحة المفتاح.");
            } finally {
                document.getElementById('scan-line').classList.add('hidden');
                document.getElementById('process-btn').innerText = "تحليل جديد";
            }
        }

        function confirmAndSave() {
            db.reports.push({ id: Date.now(), date: new Date().toLocaleDateString('ar-SA'), content: currentAnalysis });
            localStorage.setItem('health_radar_v10', JSON.stringify(db));
            alert("تم الحفظ في الأرشيف ومسح الملف المؤقت ✅");
            resetUI();
        }

        function resetUI() {
            document.getElementById('upload-ui').classList.remove('hidden');
            document.getElementById('preview-ui').classList.add('hidden');
            document.getElementById('analysis-result').classList.add('hidden');
            fileInput.value = "";
        }

        const toBase64 = file => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });

        function showTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active-nav'));
            document.getElementById(tabId).classList.add('active');
            if(tabId === 'history') renderHistory();
            lucide.createIcons();
        }

        function saveKey() {
            const key = document.getElementById('api-key').value;
            localStorage.setItem('gemini_api_key', key);
            apiKey = key;
            alert("تم حفظ المفتاح بنجاح.");
        }

        function renderHistory() {
            const list = document.getElementById('reports-list');
            list.innerHTML = db.reports.slice().reverse().map(r => `
                <div class="bg-white p-3 rounded-xl border border-slate-200 text-[10px] mb-2">
                    <span class="text-teal-600 font-bold">${r.date}</span>
                    <p class="mt-1 leading-relaxed">${r.content}</p>
                </div>
            `).join('');
        }

        lucide.createIcons();
    </script>
</body>
</html>
