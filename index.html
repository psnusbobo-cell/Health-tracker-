<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>مرشدي الصحي | المساعد الاستقصائي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f1f5f9; }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: slideUp 0.3s ease; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .active-nav { color: #0d9488; border-top: 2px solid #0d9488; }
        .pulse-border { border: 2px solid #0d9488; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { border-color: #0d9488; } 50% { border-color: #fb7185; } 100% { border-color: #0d9488; } }
    </style>
</head>
<body class="flex flex-col min-h-screen max-w-xl mx-auto bg-white shadow-2xl relative">

    <header class="bg-teal-800 text-white p-4 shadow-lg sticky top-0 z-50 flex justify-between items-center">
        <div class="flex items-center gap-2"><i data-lucide="brain-circuit"></i><h1 class="text-lg font-bold">مرشدي الاستقصائي</h1></div>
    </header>

    <main class="flex-1 p-4 pb-28 overflow-y-auto w-full">
        <div id="dashboard" class="tab-content active space-y-4">
            
            <div id="ai-inquiry-box" class="bg-teal-50 border-2 border-teal-200 p-5 rounded-2xl space-y-3 shadow-sm">
                <div class="flex items-center gap-2 text-teal-800 font-bold text-sm">
                    <i data-lucide="message-square-quote"></i>
                    <span>سؤال من مرشدك الصحي:</span>
                </div>
                <p id="inquiry-text" class="text-sm text-slate-700 leading-relaxed italic">جاري مراجعة ملفك لاستكمال البيانات التاريخية...</p>
                <div id="inquiry-input-area" class="hidden space-y-2">
                    <input id="inquiry-response" type="text" placeholder="اكتب إجابتك هنا سيدي.." class="w-full p-3 text-sm rounded-xl border border-teal-200 outline-none">
                    <button onclick="submitInquiryResponse()" class="w-full bg-teal-700 text-white py-2 rounded-xl text-xs font-bold shadow-md">تثبيت الإجابة</button>
                </div>
            </div>

            <div id="summary-stats" class="grid grid-cols-2 gap-3"></div>
        </div>

        <div id="entry" class="tab-content space-y-4">
            <h2 class="font-bold text-slate-800">إضافة قياس جديد</h2>
            <div class="bg-slate-50 p-4 rounded-2xl border border-slate-200 space-y-3">
                <input id="logDate" type="datetime-local" class="w-full p-2 text-sm rounded-lg border border-slate-200">
                <div class="grid grid-cols-2 gap-2">
                    <input id="sys" type="number" placeholder="انقباضي" class="p-3 text-sm rounded-xl border border-slate-200">
                    <input id="dia" type="number" placeholder="انبساطي" class="p-3 text-sm rounded-xl border border-slate-200">
                </div>
                <input id="glucose" type="number" placeholder="سكر الدم" class="w-full p-3 text-sm rounded-xl border border-slate-200">
                <button onclick="saveLog()" class="w-full bg-teal-700 text-white py-4 rounded-2xl font-bold">حفظ القياس</button>
            </div>
        </div>

        <div id="history" class="tab-content space-y-4">
            <h2 class="font-bold text-slate-800">السجل الطبي الدائم</h2>
            <div class="bg-white p-4 rounded-2xl border-2 border-dashed border-slate-200 space-y-3">
                <select id="eventType" class="w-full p-2 text-xs rounded-lg border border-slate-200">
                    <option value="دواء تاريخي">دواء سابق/حالي</option>
                    <option value="عملية جراحية">عملية جراحية</option>
                    <option value="حساسية">حساسية</option>
                </select>
                <input id="eventTitle" type="text" placeholder="مثلاً: الوبيورينول" class="w-full p-3 text-sm rounded-xl border border-slate-200">
                <button onclick="addMedicalEvent()" class="w-full bg-slate-800 text-white py-3 rounded-xl text-xs">+ إضافة للسجل</button>
            </div>
            <div id="medical-events-list" class="space-y-2"></div>
        </div>
    </main>

    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 flex justify-around h-18 py-2 z-50">
        <button onclick="showTab('dashboard')" class="nav-item flex flex-col items-center gap-1 active-nav"><i data-lucide="home"></i><span class="text-[9px]">الرئيسية</span></button>
        <button onclick="showTab('entry')" class="nav-item flex flex-col items-center gap-1 text-slate-400"><i data-lucide="plus-circle"></i><span class="text-[9px]">إضافة</span></button>
        <button onclick="showTab('history')" class="nav-item flex flex-col items-center gap-1 text-slate-400"><i data-lucide="folder-heart"></i><span class="text-[9px]">تاريخي</span></button>
    </nav>

    <script>
        let db = JSON.parse(localStorage.getItem('healthDB_v3')) || { readings: [], meds: [], events: [], questions: [] };

        function showTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => { n.classList.remove('active-nav'); n.classList.add('text-slate-400'); });
            document.getElementById(tabId).classList.add('active');
            event.currentTarget.classList.add('active-nav');
            if(tabId === 'dashboard') updateInquiryBox();
            if(tabId === 'history') renderMedicalEvents();
            lucide.createIcons();
        }

        // محرك الاستقصاء (The Inquiry Logic)
        function addMedicalEvent() {
            const type = document.getElementById('eventType').value;
            const title = document.getElementById('eventTitle').value;
            if(!title) return;
            
            const event = { id: Date.now(), type, title, details: {} };
            db.events.push(event);

            // توليد أسئلة بناءً على نوع المدخل
            if(type === "دواء تاريخي") {
                db.questions.push({ eventId: event.id, q: `بالنسبة لدواء [${title}]، كم كانت الجرعة اليومية وما هو سبب استخدامه؟`, key: 'dose_reason' });
                db.questions.push({ eventId: event.id, q: `متى بدأت باستخدام [${title}] وهل ما زلت مستمراً عليه؟`, key: 'duration' });
            } else if(type === "عملية جراحية") {
                db.questions.push({ eventId: event.id, q: `في أي عام أُجريت عملية [${title}]؟ وهل هناك أي مضاعفات مستمرة؟`, key: 'surgery_details' });
            }

            saveDB();
            document.getElementById('eventTitle').value = '';
            showTab('dashboard');
        }

        function updateInquiryBox() {
            const boxText = document.getElementById('inquiry-text');
            const inputArea = document.getElementById('inquiry-input-area');
            
            if(db.questions.length > 0) {
                const nextQ = db.questions[0];
                boxText.innerText = nextQ.q;
                inputArea.classList.remove('hidden');
            } else {
                boxText.innerText = "أهلاً سيدي، ملفك الصحي الحالي مكتمل. سجل قراءاتك اليومية لمتابعة التحليل.";
                inputArea.classList.add('hidden');
            }
        }

        function submitInquiryResponse() {
            const response = document.getElementById('inquiry-response').value;
            if(!response) return;

            const q = db.questions.shift(); // إخراج السؤال من الطابور
            const event = db.events.find(e => e.id === q.eventId);
            if(event) {
                event.details = event.details || {};
                event.details[q.key] = response;
            }

            saveDB();
            document.getElementById('inquiry-response').value = '';
            updateInquiryBox();
            alert("تم تحديث المرجع الصحي بنجاح ✅");
        }

        function saveLog() {
            const log = { id: Date.now(), date: new Date().toISOString(), sys: document.getElementById('sys').value, dia: document.getElementById('dia').value };
            db.readings.push(log);
            saveDB();
            showTab('dashboard');
        }

        function renderMedicalEvents() {
            const list = document.getElementById('medical-events-list');
            list.innerHTML = db.events.map((ev, i) => `
                <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
                    <div class="flex justify-between items-start">
                        <span class="text-[9px] bg-teal-100 text-teal-800 px-2 rounded-full font-bold">${ev.type}</span>
                        <button onclick="db.events.splice(${i},1); saveDB(); renderMedicalEvents();" class="text-red-400">حذف</button>
                    </div>
                    <p class="font-bold text-slate-800 mt-1">${ev.title}</p>
                    ${Object.values(ev.details || {}).map(d => `<p class="text-xs text-slate-500 mt-1">↳ ${d}</p>`).join('')}
                </div>
            `).join('');
        }

        function saveDB() { localStorage.setItem('healthDB_v3', JSON.stringify(db)); }
        lucide.createIcons();
    </script>
</body>
</html>
