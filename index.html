<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>مرشدي الصحي | النسخة النهائية المستقرة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f8fafc; overflow-x: hidden; }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .active-nav { color: #0d9488; font-weight: bold; border-top: 2px solid #0d9488; }
        .input-row { display: flex; align-items: center; justify-content: space-between; padding: 0.75rem 0; border-bottom: 1px solid #e2e8f0; }
        .input-label { font-size: 0.75rem; color: #64748b; width: 40%; }
        .input-field { width: 60%; background: transparent; border: none; font-size: 0.875rem; text-align: left; outline: none; }
    </style>
</head>
<body class="flex flex-col min-h-screen max-w-xl mx-auto bg-white shadow-2xl relative">

    <header class="bg-teal-800 text-white p-4 shadow-lg sticky top-0 z-50 flex justify-between items-center">
        <div class="flex items-center gap-2"><i data-lucide="activity"></i><h1 class="text-lg font-bold">مرشدي الصحي</h1></div>
        <div class="bg-teal-700 px-3 py-1 rounded-full text-[10px] font-mono">V 7.1</div>
    </header>

    <main class="flex-1 p-4 pb-28 overflow-y-auto w-full">
        <div id="dashboard" class="tab-content active space-y-4">
            <div id="ai-inquiry-box" class="bg-teal-50 border-2 border-teal-100 p-4 rounded-2xl space-y-3">
                <div class="flex items-center gap-2 text-teal-800 font-bold text-xs"><i data-lucide="bot"></i><span>المرشد الاستقصائي:</span></div>
                <p id="inquiry-text" class="text-xs text-slate-700 italic">جاري مراجعة سجلاتك الصحية...</p>
                <div id="inquiry-input-area" class="hidden space-y-2">
                    <input id="inquiry-response" type="text" class="w-full p-2 text-xs rounded-lg border border-teal-200 outline-none" placeholder="أدخل إجابتك هنا..">
                    <button onclick="submitInquiryResponse()" class="w-full bg-teal-700 text-white py-2 rounded-lg text-[10px] font-bold">تثبيت الإجابة</button>
                </div>
            </div>
            <div id="summary-stats" class="grid grid-cols-2 gap-3"></div>
        </div>

        <div id="entry" class="tab-content space-y-2">
            <h2 class="font-bold text-slate-800 mb-4">إضافة قياس جديد</h2>
            <div class="input-row"><span class="input-label">وقت القياس</span><input id="logDate" type="datetime-local" class="input-field"></div>
            <div class="input-row"><span class="input-label">* الانقباضي</span><input id="sys" type="number" class="input-field" placeholder="mmHg"></div>
            <div class="input-row"><span class="input-label">* الانبساطي</span><input id="dia" type="number" class="input-field" placeholder="mmHg"></div>
            <div class="input-row"><span class="input-label">السكر</span><input id="glucose" type="number" class="input-field" placeholder="mg/dL"></div>
            <div class="py-3">
                <label class="text-[10px] text-slate-400 block mb-2 font-bold">الأدوية المأخوذة حالياً:</label>
                <div id="med-tags-entry" class="flex flex-wrap gap-2"></div>
            </div>
            <button onclick="saveLog()" class="w-full bg-teal-700 text-white py-4 rounded-2xl font-bold shadow-lg mt-4 transition-all active:scale-95">حفظ القياس ✅</button>
        </div>

        <div id="charts" class="tab-content space-y-4">
            <h2 class="font-bold text-slate-800">إحصائيات المتابعة</h2>
            <div class="bg-white p-3 rounded-2xl border border-slate-200 shadow-sm"><canvas id="mainChart" height="250"></canvas></div>
        </div>

        <div id="history" class="tab-content space-y-4">
            <h2 class="font-bold text-slate-800">السجل الطبي الدائم</h2>
            <div class="bg-slate-50 p-4 rounded-2xl border-2 border-dashed border-slate-200 space-y-3">
                <select id="eventType" class="w-full p-2 text-xs rounded-lg border border-slate-200 outline-none">
                    <option value="دواء تاريخي">دواء سابق/حالي</option>
                    <option value="عملية جراحية">عملية جراحية</option>
                    <option value="حساسية">حساسية</option>
                </select>
                <input id="eventTitle" type="text" placeholder="مثلاً: الوبيورينول" class="w-full p-2 text-sm rounded-lg border border-slate-200">
                <button onclick="addMedicalEvent()" class="w-full bg-slate-800 text-white py-2 rounded-lg text-[10px] font-bold">+ إضافة للسجل</button>
            </div>
            <div id="medical-events-list" class="space-y-2"></div>
        </div>

        <div id="settings" class="tab-content space-y-6">
            <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
                <h2 class="text-sm font-bold mb-4">💊 إدارة أدوية القياس اليومي</h2>
                <div class="flex gap-2 mb-4"><input id="new-med-input" type="text" class="flex-1 p-2 text-xs rounded-lg border border-slate-200 outline-none" placeholder="اسم الدواء.."><button onclick="addMedication()" class="bg-teal-700 text-white px-4 rounded-lg">+</button></div>
                <ul id="medications-list" class="space-y-2 text-xs"></ul>
            </div>
            <div class="bg-slate-900 text-slate-300 p-4 rounded-2xl text-right font-mono text-[9px] border border-slate-700 shadow-xl">
                <p class="mb-2 text-teal-400 font-bold">تقرير Gemini الجاهز:</p>
                <div id="raw-report" class="h-32 overflow-y-auto mb-3 whitespace-pre-wrap leading-loose"></div>
                <button onclick="copyReport()" class="w-full bg-teal-600 text-white py-3 rounded-xl font-bold transition-all active:scale-95">نسخ التقرير الشامل لـ Gemini 📋</button>
            </div>
        </div>
    </main>

    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 flex justify-around py-2 z-50">
        <button onclick="showTab('dashboard')" class="nav-item flex flex-col items-center gap-1 active-nav"><i data-lucide="home" size="18"></i><span class="text-[8px]">الرئيسية</span></button>
        <button onclick="showTab('entry')" class="nav-item flex flex-col items-center gap-1 text-slate-400"><i data-lucide="plus-circle" size="18"></i><span class="text-[8px]">إضافة</span></button>
        <button onclick="showTab('charts')" class="nav-item flex flex-col items-center gap-1 text-slate-400"><i data-lucide="activity" size="18"></i><span class="text-[8px]">إحصائيات</span></button>
        <button onclick="showTab('history')" class="nav-item flex flex-col items-center gap-1 text-slate-400"><i data-lucide="folder-heart" size="18"></i><span class="text-[8px]">تاريخي</span></button>
        <button onclick="showTab('settings')" class="nav-item flex flex-col items-center gap-1 text-slate-400"><i data-lucide="settings" size="18"></i><span class="text-[8px]">المزيد</span></button>
    </nav>

    <script>
        // ميزة هجرة البيانات (Data Migration Engine)
        function migrateData() {
            const keys = ['healthDB_v2', 'healthDB_v3', 'healthMaster_v7'];
            let migratedDb = { readings: [], meds: [], events: [], questions: [] };
            
            keys.forEach(key => {
                const oldData = JSON.parse(localStorage.getItem(key));
                if (oldData) {
                    if (Array.isArray(oldData.readings)) migratedDb.readings = [...migratedDb.readings, ...oldData.readings];
                    if (Array.isArray(oldData.meds)) migratedDb.meds = [...new Set([...migratedDb.meds, ...oldData.meds])];
                    if (Array.isArray(oldData.events)) migratedDb.events = [...migratedDb.events, ...oldData.events];
                    if (Array.isArray(oldData.questions)) migratedDb.questions = [...migratedDb.questions, ...oldData.questions];
                    // إزالة النسخة القديمة بعد الهجرة لتنظيف الذاكرة
                    localStorage.removeItem(key);
                }
            });

            // إذا وجدت بيانات قديمة، احفظها في النسخة الجديدة المستقرة
            if (migratedDb.readings.length > 0 || migratedDb.meds.length > 0) {
                localStorage.setItem('health_stable_v1', JSON.stringify(migratedDb));
            }
        }

        migrateData();
        let db = JSON.parse(localStorage.getItem('health_stable_v1')) || { readings: [], meds: [], events: [], questions: [] };

        function showTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => { n.classList.remove('active-nav'); n.classList.add('text-slate-400'); });
            document.getElementById(tabId).classList.add('active');
            event.currentTarget.classList.add('active-nav');
            event.currentTarget.classList.remove('text-slate-400');
            if(tabId === 'dashboard') updateInquiryBox();
            if(tabId === 'charts') initCharts();
            if(tabId === 'settings') { renderMeds(); generateReport(); }
            if(tabId === 'history') renderMedicalEvents();
            if(tabId === 'entry') setDefaultDate();
            renderMedTags();
            lucide.createIcons();
        }

        function setDefaultDate() { const now = new Date(); now.setMinutes(now.getMinutes() - now.getTimezoneOffset()); document.getElementById('logDate').value = now.toISOString().slice(0, 16); }

        function addMedicalEvent() {
            const type = document.getElementById('eventType').value;
            const title = document.getElementById('eventTitle').value;
            if(!title) return;
            const eventObj = { id: Date.now(), type, title, details: {} };
            db.events.push(eventObj);
            if(type === "دواء تاريخي") {
                db.questions.push({ eventId: eventObj.id, q: `بالنسبة لدواء [${title}]، كم كانت الجرعة اليومية وما هو سبب استخدامه؟`, key: 'dose_reason' });
            }
            saveDB(); document.getElementById('eventTitle').value = ''; showTab('dashboard');
        }

        function updateInquiryBox() {
            const boxText = document.getElementById('inquiry-text');
            const inputArea = document.getElementById('inquiry-input-area');
            if(db.questions.length > 0) {
                boxText.innerText = db.questions[0].q;
                inputArea.classList.remove('hidden');
            } else {
                boxText.innerText = db.readings.length > 0 ? "✅ ملفك مكتمل وقراءاتك تحت المراقبة." : "أهلاً بك سيدي! ابدأ بإضافة قراءاتك لتفعيل التحليل الذكي.";
                inputArea.classList.add('hidden');
            }
            updateSummary();
        }

        function submitInquiryResponse() {
            const response = document.getElementById('inquiry-response').value;
            if(!response) return;
            const q = db.questions.shift();
            const ev = db.events.find(e => e.id === q.eventId);
            if(ev) { ev.details[q.key] = response; }
            saveDB(); document.getElementById('inquiry-response').value = ''; updateInquiryBox();
        }

        function saveLog() {
            const log = { id: Date.now(), date: document.getElementById('logDate').value, sys: document.getElementById('sys').value, dia: document.getElementById('dia').value, glucose: document.getElementById('glucose').value, meds: Array.from(document.querySelectorAll('.med-checkbox:checked')).map(c => c.value) };
            if(!log.sys && !log.glucose) return;
            db.readings.push(log);
            db.readings.sort((a,b) => new Date(a.date) - new Date(b.date));
            saveDB(); alert("تم الحفظ بنجاح ✅"); showTab('dashboard');
        }

        function initCharts() {
            const ctx = document.getElementById('mainChart').getContext('2d');
            if(window.hChart) window.hChart.destroy();
            const recent = db.readings.slice(-15);
            window.hChart = new Chart(ctx, { type: 'line', data: { labels: recent.map(l => l.date.slice(5, 10)), datasets: [{ label: 'الضغط', data: recent.map(l => l.sys), borderColor: '#0d9488', tension: 0.3 }, { label: 'السكر', data: recent.map(l => l.glucose), borderColor: '#fb7185', tension: 0.3 }] } });
        }

        function renderMedicalEvents() {
            const list = document.getElementById('medical-events-list');
            list.innerHTML = db.events.map((ev, i) => `<div class="bg-white p-3 rounded-xl border border-slate-200 flex justify-between items-center text-xs"><div><span class="bg-slate-100 px-2 rounded-full text-[9px] font-bold">${ev.type}</span><p class="font-bold mt-1">${ev.title}</p>${Object.values(ev.details).map(d => `<p class="text-slate-500 italic mt-1">↳ ${d}</p>`).join('')}</div><button onclick="db.events.splice(${i},1); saveDB(); renderMedicalEvents();" class="text-red-400"><i data-lucide="x" size="14"></i></button></div>`).join('');
            lucide.createIcons();
        }

        function addMedication() { const val = document.getElementById('new-med-input').value; if(val) { db.meds.push(val); saveDB(); document.getElementById('new-med-input').value=''; renderMeds(); } }
        function renderMeds() { const list = document.getElementById('medications-list'); list.innerHTML = db.meds.map((m, i) => `<li class="flex justify-between bg-slate-50 p-2 rounded-lg border"><span>${m}</span><button onclick="db.meds.splice(${i},1);saveDB();renderMeds();" class="text-red-400">حذف</button></li>`).join(''); }
        function renderMedTags() { const container = document.getElementById('med-tags-entry'); container.innerHTML = db.meds.map(m => `<label class="flex items-center gap-1 bg-slate-100 px-3 py-1 rounded-full text-[10px] has-[:checked]:border-teal-500 border border-transparent cursor-pointer"><input type="checkbox" value="${m}" class="med-checkbox hidden"> <span>${m}</span></label>`).join(''); }
        function saveDB() { localStorage.setItem('health_stable_v1', JSON.stringify(db)); }
        
        function generateReport() { 
            let report = `التقرير الصحي الشامل\nالتاريخ: ${new Date().toLocaleDateString('ar-SA')}\n\n`;
            report += `--- السجل التاريخي ---\n` + db.events.map(e => `- ${e.type}: ${e.title} (${Object.values(e.details).join(', ')})`).join('\n') + `\n\n`;
            report += `--- آخر 5 قراءات ---\n` + db.readings.slice(-5).reverse().map(l => `- ${l.date.replace('T', ' ')}: الضغط ${l.sys}/${l.dia} | السكر ${l.glucose || '-'}`).join('\n');
            document.getElementById('raw-report').innerText = report; 
        }

        function copyReport() { navigator.clipboard.writeText(document.getElementById('raw-report').innerText); alert("تم نسخ التقرير الشامل!"); }
        
        function updateSummary() {
            const last = db.readings[db.readings.length-1];
            if(!last) return;
            document.getElementById('summary-stats').innerHTML = `<div class="bg-white p-3 rounded-xl border text-center shadow-sm"><p class="text-[9px] text-slate-400">آخر ضغط</p><p class="font-bold text-teal-600 text-sm">${last.sys}/${last.dia}</p></div><div class="bg-white p-3 rounded-xl border text-center shadow-sm"><p class="text-[9px] text-slate-400">آخر سكر</p><p class="font-bold text-rose-500 text-sm">${last.glucose || '-'}</p></div>`;
        }
        lucide.createIcons(); updateInquiryBox();
    </script>
</body>
</html>
