<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مرشد صحتي الذكي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .card { background: #1e293b; border-radius: 12px; padding: 1.5rem; margin-bottom: 1rem; border: 1px solid #334155; }
    </style>
</head>
<body class="p-4 pb-20">

    <header class="mb-6 text-center">
        <h1 class="text-2xl font-bold text-sky-400">مرشد صحتي الذكي</h1>
        <div id="ai-mentor-box" class="mt-4 p-3 bg-sky-900/30 border border-sky-500/50 rounded-lg text-sm text-sky-200">
            جاري تحليل بياناتك... ابدأ بإضافة قراءاتك اليوم.
        </div>
    </header>

    <nav class="fixed bottom-0 left-0 right-0 bg-slate-900 border-t border-slate-700 flex justify-around p-3 z-50">
        <button onclick="showTab('entry')" class="flex flex-col items-center text-sky-400">
            <span>➕</span><span class="text-xs">إضافة</span>
        </button>
        <button onclick="showTab('dashboard')" class="flex flex-col items-center text-slate-400">
            <span>📊</span><span class="text-xs">الرسوم</span>
        </button>
        <button onclick="showTab('settings')" class="flex flex-col items-center text-slate-400">
            <span>💊</span><span class="text-xs">الأدوية</span>
        </button>
    </nav>

    <div id="entry" class="tab-content active">
        <div class="card">
            <h2 class="text-lg font-bold mb-4">إضافة قياس جديد</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm mb-1">ضغط الدم (الانقباضي/الانبساطي)</label>
                    <div class="flex gap-2">
                        <input id="sys" type="number" placeholder="120" class="w-full bg-slate-800 border border-slate-600 p-2 rounded text-white">
                        <input id="dia" type="number" placeholder="80" class="w-full bg-slate-800 border border-slate-600 p-2 rounded text-white">
                    </div>
                </div>
                <div>
                    <label class="block text-sm mb-1">مستوى السكر (mg/dL)</label>
                    <input id="sugar" type="number" placeholder="100" class="w-full bg-slate-800 border border-slate-600 p-2 rounded text-white">
                </div>
                <div>
                    <label class="block text-sm mb-1">الأدوية المأخوذة</label>
                    <div id="med-tags-container" class="flex flex-wrap gap-2 py-2">
                        </div>
                </div>
                <button onclick="saveData()" class="w-full bg-sky-600 hover:bg-sky-500 p-3 rounded-lg font-bold transition">حفظ القياس</button>
            </div>
        </div>
    </div>

    <div id="dashboard" class="tab-content">
        <div class="card">
            <canvas id="healthChart"></canvas>
        </div>
        <button onclick="generateAIPrompt()" class="w-full bg-emerald-600 p-3 rounded-lg font-bold mb-4">نسخ تقرير الـ AI للمناقشة</button>
        <div id="history-list" class="space-y-2"></div>
    </div>

    <div id="settings" class="tab-content">
        <div class="card">
            <h2 class="text-lg font-bold mb-4">إدارة الأدوية</h2>
            <div class="flex gap-2 mb-4">
                <input id="new-med" type="text" placeholder="اسم الدواء" class="w-full bg-slate-800 border border-slate-600 p-2 rounded">
                <button onclick="addMed()" class="bg-sky-600 px-4 rounded">+</button>
            </div>
            <ul id="meds-list" class="space-y-2"></ul>
        </div>
    </div>

    <script>
        let db = JSON.parse(localStorage.getItem('healthDB')) || { readings: [], meds: [] };

        function showTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            if(tabId === 'dashboard') renderChart();
            renderMedTags();
        }

        function addMed() {
            const name = document.getElementById('new-med').value;
            if(name) {
                db.meds.push(name);
                saveDB();
                document.getElementById('new-med').value = '';
                renderMeds();
                renderMedTags();
            }
        }

        function renderMeds() {
            const list = document.getElementById('meds-list');
            list.innerHTML = db.meds.map((m, i) => `<li class="flex justify-between bg-slate-800 p-2 rounded"><span>${m}</span><button onclick="db.meds.splice(${i},1);saveDB();renderMeds();" class="text-red-400 text-xs">حذف</button></li>`).join('');
        }

        function renderMedTags() {
            const container = document.getElementById('med-tags-container');
            container.innerHTML = db.meds.map(m => `<label class="inline-flex items-center bg-slate-700 px-3 py-1 rounded-full text-xs cursor-pointer"><input type="checkbox" value="${m}" class="hidden peer"><span class="peer-checked:text-sky-400">${m}</span></label>`).join('');
        }

        function saveData() {
            const sys = document.getElementById('sys').value;
            const dia = document.getElementById('dia').value;
            const sugar = document.getElementById('sugar').value;
            const selectedMeds = Array.from(document.querySelectorAll('#med-tags-container input:checked')).map(i => i.value);
            
            if(!sys && !sugar) return alert("يرجى إدخال قياس واحد على الأقل");

            db.readings.push({
                date: new Date().toLocaleString('ar-SA'),
                timestamp: Date.now(),
                sys, dia, sugar, meds: selectedMeds
            });
            saveDB();
            alert("تم الحفظ بنجاح");
            showTab('dashboard');
        }

        function saveDB() {
            localStorage.setItem('healthDB', JSON.stringify(db));
            updateAIMentor();
        }

        function updateAIMentor() {
            const last = db.readings[db.readings.length - 1];
            const box = document.getElementById('ai-mentor-box');
            if(!last) return;
            
            if(last.sys > 140) {
                box.innerHTML = "⚠️ سيدي، ضغطك الانقباضي مرتفع قليلاً (${last.sys}). هل شعرت بالتوتر اليوم؟";
                box.className = "mt-4 p-3 bg-red-900/30 border border-red-500/50 rounded-lg text-sm text-red-200";
            } else {
                box.innerHTML = "✅ قراءاتك تبدو مستقرة. استمر في نشاطك البدني والسباحة!";
                box.className = "mt-4 p-3 bg-emerald-900/30 border border-emerald-500/50 rounded-lg text-sm text-emerald-200";
            }
        }

        function generateAIPrompt() {
            const report = JSON.stringify(db.readings.slice(-10));
            const prompt = `أنا مريض أتابع حالتي، إليك آخر 10 قراءات (ضغط وسكر) مع الأدوية المتناولة: ${report}. بصفتك خبيراً طبياً، حلل الأنماط واقترح عليّ أسئلة لمناقشتها مع طبيبي.`;
            navigator.clipboard.writeText(prompt);
            alert("تم نسخ التقرير! يمكنك لصقه الآن في Gemini للحصول على تحليل معمق.");
        }

        function renderChart() {
            const ctx = document.getElementById('healthChart').getContext('2d');
            if(window.myChart) window.myChart.destroy();
            
            const labels = db.readings.slice(-7).map(r => r.date.split(' ')[0]);
            window.myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        { label: 'انقباضي', data: db.readings.slice(-7).map(r => r.sys), borderColor: '#38bdf8', tension: 0.1 },
                        { label: 'سكر', data: db.readings.slice(-7).map(r => r.sugar), borderColor: '#fbbf24', tension: 0.1 }
                    ]
                },
                options: { plugins: { legend: { labels: { color: '#fff' } } } }
            });
        }

        // Initialize
        renderMeds();
        updateAIMentor();
    </script>
</body>
</html>
